<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>魔法使いの館 Survival</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070c;touch-action:none;font-family:monospace}
canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
#hud{position:fixed;z-index:4;left:14px;top:10px;color:#fff;font-weight:900;text-shadow:2px 2px #000;pointer-events:none}
#title{font-size:20px;margin-bottom:7px}.row{font-size:18px;margin:3px 0}
#bar{display:inline-block;width:min(270px,45vw);height:16px;background:#251820;border:2px solid #eee;vertical-align:middle}.fill{height:100%;width:100%;background:#d8293e}
#buff{color:#ffd75d}
#touch{display:none;position:fixed;inset:0;z-index:10;pointer-events:none}@media(pointer:coarse){#touch{display:block}}
.pad{position:absolute;left:18px;bottom:22px;width:156px;height:156px;pointer-events:auto}
.btn{position:absolute;width:52px;height:52px;border:2px solid #ffffffaa;border-radius:13px;background:#121523c0;color:white;display:grid;place-items:center;font-size:24px;font-weight:900;user-select:none;-webkit-user-select:none}
.up{left:52px}.left{left:0;top:52px}.down{left:52px;top:104px}.right{left:104px;top:52px}
.actions{position:absolute;right:18px;bottom:28px;width:184px;height:126px;pointer-events:auto}
#fire{right:0;top:0;width:78px;height:78px;border-radius:50%;font-size:32px;background:#7d241fd9}#jump{left:0;bottom:0;width:82px;font-size:13px;background:#1e4b85d9}
#result{display:none;position:fixed;z-index:30;inset:0;background:#08060be8;color:white;place-items:center;text-align:center}
.card{padding:30px 40px;min-width:290px;border:2px solid #bd9452;border-radius:16px;background:#18121d}.card h1{color:#ffd56a}.card p{font-size:19px}.card button{padding:12px 24px;border:0;border-radius:9px;font-weight:900;font-size:16px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div id="title">♜ 魔法使いの館 Survival</div>
 <div class="row">HP <span id="bar"><span id="hpFill" class="fill"></span></span> <span id="hpText">100 / 100</span></div>
 <div class="row">SCORE <span id="scoreText">0</span>　HI-SCORE <span id="hiText">0</span></div>
 <div class="row">TIME <span id="timeText">60:00</span>　<span id="buff">🔥 ×1</span></div>
</div>
<div id="touch">
 <div class="pad"><div class="btn up" data-dir="up">▲</div><div class="btn left" data-dir="left">◀</div><div class="btn down" data-dir="down">▼</div><div class="btn right" data-dir="right">▶</div></div>
 <div class="actions"><div class="btn" id="fire">🔥</div><div class="btn" id="jump">JUMP</div></div>
</div>
<div id="result"><div class="card"><h1>RESULT</h1><p id="lastScore"></p><p id="highScore"></p><button id="restart">もう一度</button></div></div>

<script>
"use strict";
const C=document.getElementById("game"),G=C.getContext("2d");
const E=id=>document.getElementById(id);
const hpFill=E("hpFill"),hpText=E("hpText"),scoreText=E("scoreText"),hiText=E("hiText"),timeText=E("timeText"),buff=E("buff");
const result=E("result"),lastScore=E("lastScore"),highScore=E("highScore"),restart=E("restart"),fireBtn=E("fire"),jumpBtn=E("jump");
let W,H,DPR;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);C.width=W*DPR;C.height=H*DPR;G.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const keys={up:0,down:0,left:0,right:0};
const LIMIT=3600;
let p,enemies,shots,pickups,fx,hp,score,elapsed,spawnClock,hitClock,coinClock,ringSpawned,fireLevel,jumpT,magicT,lastDir,over;

let ACtx=null;
function beep(f,d,type="square",vol=.035,end=null){
 try{if(!ACtx)ACtx=new (window.AudioContext||window.webkitAudioContext)();if(ACtx.state==="suspended")ACtx.resume();
 const o=ACtx.createOscillator(),g=ACtx.createGain(),t=ACtx.currentTime;o.type=type;o.frequency.setValueAtTime(f,t);
 if(end)o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g);g.connect(ACtx.destination);o.start(t);o.stop(t+d)}catch(_){}}
const sJump=()=>beep(310,.17,"square",.035,610);
const sFire=()=>{beep(170,.12,"sawtooth",.035,440);setTimeout(()=>beep(520,.07,"square",.02,260),55)};
const sHurt=()=>beep(125,.22,"sawtooth",.055,55);
const sCoin=()=>{beep(620,.10,"sine",.035,800);setTimeout(()=>beep(850,.13,"sine",.03,1050),90)};
const sRing=()=>{[440,660,880].forEach((f,i)=>setTimeout(()=>beep(f,.15,"sine",.035,f+100),i*100))};


const IMG={};
function loadImg(name,src){const im=new Image();im.src=src;IMG[name]=im;return im}
loadImg("mansion","assets/mansion.png");
loadImg("playerIdle","assets/player_idle.png");
loadImg("playerDown","assets/player_down.png");
loadImg("playerUp","assets/player_up.png");
loadImg("playerLeft","assets/player_left.png");
loadImg("playerRight","assets/player_right.png");
loadImg("playerJump","assets/player_jump.png");
loadImg("playerCast","assets/player_cast.png");
loadImg("playerDamage","assets/player_damage.png");
loadImg("enemy","assets/enemy.png");
loadImg("enemyCrown","assets/enemy_crown.png");
loadImg("fireball","assets/fireball.png");
loadImg("magicCircle","assets/magic_circle.png");
loadImg("coin","assets/coin.png");
loadImg("ring","assets/ring.png");

function reset(){
 p={x:W/2,y:H/2,r:15};enemies=[];shots=[];pickups=[];fx=[];hp=100;score=0;elapsed=0;spawnClock=0;hitClock=-10;coinClock=0;
 ringSpawned=false;fireLevel=1;jumpT=0;magicT=0;lastDir={x:1,y:0};over=false;result.style.display="none";hud();
}
function hud(){
 hpFill.style.width=hp+"%";hpText.textContent=`${hp} / 100`;scoreText.textContent=score;
 const hi=+localStorage.getItem("mansionHighScoreV3")||0;hiText.textContent=hi;
 let r=Math.max(0,Math.ceil(LIMIT-elapsed));timeText.textContent=`${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`;buff.textContent=`🔥 ×${fireLevel}`;
}
function edgeSpawn(){
 let side=Math.floor(Math.random()*4),m=35,boss=Math.random()<.18,e={x:0,y:0,r:boss?18:15,s:(boss?42:52)+Math.random()*30,hp:boss?2:1,boss};
 if(side===0){e.x=Math.random()*W;e.y=-m}else if(side===1){e.x=W+m;e.y=Math.random()*H}else if(side===2){e.x=Math.random()*W;e.y=H+m}else{e.x=-m;e.y=Math.random()*H}
 enemies.push(e);
}
function spawnPickup(type){pickups.push({type,x:55+Math.random()*Math.max(1,W-110),y:75+Math.random()*Math.max(1,H-145),r:type==="ring"?16:13,t:0})}
function jump(){if(over||jumpT>0)return;jumpT=.52;sJump()}
function fire(){
 if(over)return;magicT=.25;sFire();
 let a=Math.atan2(lastDir.y,lastDir.x),spread=.16;
 for(let i=0;i<fireLevel;i++){
  let off=(i-(fireLevel-1)/2)*spread,ang=a+off,dx=Math.cos(ang),dy=Math.sin(ang);
  shots.push({x:p.x+dx*24,y:p.y+dy*24,vx:dx*480,vy:dy*480,r:8,life:1.45});
 }
}
function finish(){
 if(over)return;over=true;let old=+localStorage.getItem("mansionHighScoreV3")||0,hi=Math.max(old,score);
 localStorage.setItem("mansionHighScoreV3",hi);lastScore.textContent=`直近のスコア：${score}`;highScore.textContent=`ハイスコア：${hi}`;result.style.display="grid";hud();
}
restart.onclick=reset;

function setKey(code,v){
 if(code==="KeyW"||code==="ArrowUp")keys.up=v;if(code==="KeyS"||code==="ArrowDown")keys.down=v;
 if(code==="KeyA"||code==="ArrowLeft")keys.left=v;if(code==="KeyD"||code==="ArrowRight")keys.right=v;
}
addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();setKey(e.code,1);if(e.code==="Space"&&!e.repeat)jump()});
addEventListener("keyup",e=>setKey(e.code,0));
C.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button===0)fire()});
document.querySelectorAll("[data-dir]").forEach(b=>{let d=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys[d]=1;b.setPointerCapture(e.pointerId)};b.onpointerup=()=>keys[d]=0;b.onpointercancel=()=>keys[d]=0});
fireBtn.onpointerdown=e=>{e.preventDefault();fire()};jumpBtn.onpointerdown=e=>{e.preventDefault();jump()};

const collide=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r;
function burst(x,y,color,n=9){for(let i=0;i<n;i++){let a=Math.random()*6.283,s=35+Math.random()*100;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.35,color})}}
function update(dt,t){
 if(over)return;if(hp<=0){hp=0;hud();finish();return}elapsed+=dt;if(elapsed>=LIMIT){finish();return}
 let dx=keys.right-keys.left,dy=keys.down-keys.up,l=Math.hypot(dx,dy);
 if(l){dx/=l;dy/=l;lastDir={x:dx,y:dy};p.x+=dx*190*dt;p.y+=dy*190*dt}
 p.x=Math.max(24,Math.min(W-24,p.x));p.y=Math.max(45,Math.min(H-24,p.y));
 jumpT=Math.max(0,jumpT-dt);magicT=Math.max(0,magicT-dt);
 // 敵の出現ペース：開始時は少なく、3分ごとに段階的に増加
 const stage=Math.min(10,Math.floor(elapsed/180)); // 0,1,2...（3分ごと）
 const spawnInterval=Math.max(.42,2.8-stage*.22);
 const maxEnemies=Math.min(36,4+stage*3);
 if(t-spawnClock>spawnInterval && enemies.length<maxEnemies){edgeSpawn();spawnClock=t}
 if(elapsed-coinClock>=60){spawnPickup("coin");coinClock+=60}
 if(elapsed>=180&&!ringSpawned&&fireLevel<5){spawnPickup("ring");ringSpawned=true}
 shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});shots=shots.filter(s=>s.life>0&&s.x>-40&&s.x<W+40&&s.y>-40&&s.y<H+40);
 enemies.forEach(e=>{let ax=p.x-e.x,ay=p.y-e.y,ll=Math.hypot(ax,ay)||1;e.x+=ax/ll*e.s*dt;e.y+=ay/ll*e.s*dt});
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i],gone=false;
  for(let j=shots.length-1;j>=0;j--)if(collide(e,shots[j])){
   shots.splice(j,1);e.hp--;burst(e.x,e.y,e.boss?"#ffd45c":"#ba7cff",7);
   if(e.hp<=0){score+=e.boss?20:10;enemies.splice(i,1);gone=true}break;
  }
  if(!gone&&jumpT<=0&&collide(e,p)&&t-hitClock>.65){hp=Math.max(0,hp-5);hitClock=t;burst(p.x,p.y,"#ff5368",10);sHurt();if(hp<=0){hp=0;hud();finish();return}}
 }
 for(let i=pickups.length-1;i>=0;i++){let q=pickups[i];q.t+=dt;if(collide(p,q)){
   if(q.type==="coin"){hp=Math.min(100,hp+10);sCoin()}else{fireLevel=Math.min(5,fireLevel*2);if(fireLevel>5)fireLevel=5;sRing()}
   burst(q.x,q.y,q.type==="coin"?"#ffd84c":"#77d8ff",14);pickups.splice(i,1);
 }}
 fx.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt});fx=fx.filter(f=>f.life>0);hud();
}
function mansion(){
 if(IMG.mansion&&IMG.mansion.complete&&IMG.mansion.naturalWidth){
   const im=IMG.mansion, cut=Math.floor(im.height*0.10);
   G.drawImage(im,0,cut,im.width,im.height-cut,0,0,W,H);return;
 }
 G.fillStyle="#241b24";G.fillRect(0,0,W,H);
 let tile=48;for(let y=0;y<H;y+=tile)for(let x=0;x<W;x+=tile){G.fillStyle=((x/tile+y/tile)&1)?"#40363a":"#514344";G.fillRect(x,y,tile,tile)}
 G.fillStyle="#651823";G.fillRect(W*.44,0,W*.12,H);G.fillRect(0,H*.44,W,H*.14);
}
function magic(){
 if(!magicT)return;G.save();G.translate(p.x,p.y+17);G.globalAlpha=Math.min(1,magicT/.18);G.strokeStyle="#72d8ff";G.lineWidth=2;
 G.beginPath();G.ellipse(0,0,31,13,0,0,7);G.stroke();G.beginPath();G.ellipse(0,0,22,9,0,0,7);G.stroke();
 G.rotate(Math.PI/4);G.strokeRect(-10,-10,20,20);G.restore();
}
function player(){
 let lift=jumpT?Math.sin((1-jumpT/.52)*Math.PI)*25:0, x=Math.round(p.x), y=Math.round(p.y-lift);
 G.save();G.translate(x,y);
 G.fillStyle="#0008";G.beginPath();G.ellipse(0,22+lift,16,5,0,0,7);G.fill();
 // boots
 G.fillStyle="#17121c";G.fillRect(-11,9,8,15);G.fillRect(4,9,8,15);
 // red/black gothic outfit
 G.fillStyle="#8f1f3b";G.fillRect(-16,-6,32,20);G.fillRect(-20,8,40,7);
 G.fillStyle="#17121c";G.fillRect(-9,-5,18,18);G.fillRect(-16,11,32,6);
 // silver hair
 G.fillStyle="#e7e3ed";G.fillRect(-16,-31,32,24);G.fillRect(-21,-23,8,28);G.fillRect(13,-23,8,28);
 G.fillStyle="#bdb8c9";G.fillRect(-18,-27,4,24);G.fillRect(14,-27,4,24);
 // face
 G.fillStyle="#f3c7bb";G.fillRect(-10,-22,20,14);
 G.fillStyle="#b72b55";G.fillRect(-6,-18,3,4);G.fillRect(4,-18,3,4);
 // bows
 G.fillStyle="#17121c";G.fillRect(-19,-35,10,8);G.fillRect(9,-35,10,8);G.fillRect(-5,-33,10,5);
 G.fillStyle="#c1284b";G.fillRect(-15,-33,4,4);G.fillRect(11,-33,4,4);
 // casting arm
 if(magicT>0){G.fillStyle="#f3c7bb";let sx=lastDir.x>=0?15:-20;G.fillRect(sx,-4,6,5)}
 // damage flash
 if(performance.now()/1000-hitClock<.18){G.globalCompositeOperation="source-atop";G.fillStyle="#ff6a78aa";G.fillRect(-24,-38,48,66)}
 G.restore();
}
function enemy(e){
 G.save();G.translate(Math.round(e.x),Math.round(e.y));
 G.fillStyle="#0007";G.beginPath();G.ellipse(0,e.r+8,e.r*.75,5,0,0,7);G.fill();
 G.fillStyle=e.boss?"#6c2a94":"#7937a9";G.beginPath();G.arc(0,0,e.r,0,7);G.fill();
 G.fillStyle="#a75bd0";G.beginPath();G.arc(-5,-6,e.r*.55,0,7);G.fill();
 G.fillStyle="#32183e";
 G.beginPath();G.moveTo(-10,-11);G.lineTo(-18,-20);G.lineTo(-5,-14);G.fill();
 G.beginPath();G.moveTo(10,-11);G.lineTo(18,-20);G.lineTo(5,-14);G.fill();
 G.fillStyle="#fff";G.fillRect(-8,-4,5,5);G.fillRect(3,-4,5,5);
 G.fillStyle="#25142e";G.fillRect(-6,-3,2,3);G.fillRect(5,-3,2,3);G.fillRect(-4,6,8,2);
 if(e.boss){G.fillStyle="#ffd447";G.beginPath();G.moveTo(-12,-16);G.lineTo(-8,-27);G.lineTo(0,-20);G.lineTo(8,-27);G.lineTo(12,-16);G.closePath();G.fill()}
 G.restore();
}
function shot(s){
 let ang=Math.atan2(s.vy,s.vx);G.save();G.translate(s.x,s.y);G.rotate(ang);
 G.fillStyle="#ff4b16";G.fillRect(-13,-6,20,12);G.fillRect(-20,-3,10,6);
 G.fillStyle="#ff9c24";G.fillRect(-9,-8,18,16);
 G.fillStyle="#fff06a";G.fillRect(-5,-5,12,10);G.restore();
}
function pickup(q){
 G.save();G.translate(q.x,q.y);
 if(q.type==="coin"){G.fillStyle="#9b6412";G.beginPath();G.arc(0,0,15,0,7);G.fill();G.fillStyle="#ffd84b";G.beginPath();G.arc(0,0,11,0,7);G.fill();G.fillStyle="#fff2a2";G.fillRect(-2,-7,4,14)}
 else{G.strokeStyle="#ffd54d";G.lineWidth=5;G.beginPath();G.arc(0,4,10,0,7);G.stroke();G.fillStyle="#e14c83";G.fillRect(-5,-12,10,9);G.fillStyle="#ff9ac0";G.fillRect(-2,-11,4,4)}
 G.restore();
}
function render(){mansion();magic();pickups.forEach(pickup);enemies.forEach(enemy);shots.forEach(shot);fx.forEach(f=>{G.globalAlpha=Math.min(1,f.life/.3);G.fillStyle=f.color;G.fillRect(f.x,f.y,4,4);G.globalAlpha=1});player()}
let prev=performance.now();function loop(ms){let dt=Math.min(.033,(ms-prev)/1000);prev=ms;update(dt,ms/1000);render();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script>
</body></html>
